<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100E10">
<title>Let There Be Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#100E10;
  --text:#E9EAEB; --mute:#8C8A90; --dim:#5E5C63;
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --lift-light:
    inset 0 1px 0 rgba(255,255,255,.96), inset 0 -2px 3px rgba(0,0,0,.18),
    0 1px 0 #9B9EA0, 0 2px 0 #7C7F81, 0 3px 0 #5F6264, 0 4px 0 #46494B,
    0 12px 20px -6px rgba(0,0,0,.9), 0 26px 44px -14px rgba(0,0,0,.8);
  --lift-dark:
    inset 0 1px 0 rgba(255,255,255,.11), inset 0 -1px 0 rgba(0,0,0,.85),
    0 2px 0 rgba(0,0,0,.75), 0 14px 26px -10px rgba(0,0,0,.95);
  --sink:
    inset 0 3px 7px rgba(0,0,0,.95), inset 0 1px 2px rgba(0,0,0,1),
    inset 0 -1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
  background:var(--ground);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #8E9193;outline-offset:4px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{width:100%;max-width:760px;margin:0 auto;padding:clamp(40px,7vw,72px) 20px}
.lock{width:clamp(190px,30vw,250px);margin:0 auto}
.label{font-family:var(--serif);font-size:clamp(34px,5.6vw,56px);font-weight:400;letter-spacing:.015em;
  text-transform:uppercase;color:#E9EAEB;display:block;text-align:center;margin-top:clamp(34px,5vw,48px)}
h1{margin:14px 0 0;font-family:var(--sans);font-weight:400;font-size:clamp(17px,2.4vw,23px);
  line-height:1.4;letter-spacing:0;text-align:center;text-wrap:balance;color:var(--mute)}
.lede{margin:clamp(18px,2.6vw,24px) auto 0;max-width:46ch;text-align:center;color:var(--mute);
  font-size:clamp(15px,1.8vw,17.5px);line-height:1.6}

/* the deck — a record sitting in a recessed tray */
.deck{margin-top:clamp(38px,5.6vw,56px);padding:clamp(20px,3vw,28px);border-radius:22px;
  background:linear-gradient(180deg,#0A090B 0%,#141216 100%);box-shadow:var(--sink)}
.meta{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meta .t{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);line-height:1.1;color:#F0F1F2}
.meta .a{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

.ab{margin-top:clamp(18px,2.6vw,22px);display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:linear-gradient(180deg,#0A090B 0%,#151317 100%);box-shadow:var(--sink)}
.tab{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:11px 20px;border:0;border-radius:999px;cursor:pointer;background:transparent;color:var(--dim);
  transition:color .18s ease}
.tab:hover{color:var(--text)}
.tab.on{color:#141316;background:linear-gradient(178deg,#FDFDFE 0%,#F1F2F3 40%,#D5D8D9 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 0 #7C7F81,0 2px 0 #5F6264,0 6px 12px -4px rgba(0,0,0,.85)}
.player{margin-top:clamp(16px,2.4vw,20px);display:flex;align-items:center;gap:16px}
.play{width:64px;height:64px;flex:none;border:0;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:#141316;
  background:linear-gradient(178deg,#FDFDFE 0%,#F1F2F3 40%,#D5D8D9 100%);
  box-shadow:var(--lift-light);
  transition:transform .12s cubic-bezier(.3,.8,.4,1)}
.play:active{transform:translateY(4px)}
.play svg{width:22px;height:22px;margin-left:2px}
.play.on svg{margin-left:0}

.bars{flex:1 1 auto;min-width:0;height:64px;position:relative;border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#0A090B 0%,#151317 100%);box-shadow:var(--sink);cursor:pointer}
.bars canvas{display:block;width:100%;height:100%}
.time{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;min-width:7ch;text-align:right;
  font-variant-numeric:tabular-nums}

.note{margin-top:18px;font-size:13px;line-height:1.55;color:var(--dim);text-align:center}

.how{margin-top:clamp(38px,5.6vw,56px);display:grid;gap:12px;grid-template-columns:1fr;
  max-width:540px;margin-inline:auto}

.step{border-radius:14px;padding:20px 18px 22px;
  background:linear-gradient(180deg,#262329 0%,#1A181C 58%,#141216 100%);box-shadow:var(--lift-dark)}
.step .n{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;color:#6E6B74}
.step .w{font-size:17px;font-weight:700;margin-top:20px;color:#EDEEEF}
.step .d{font-size:13px;line-height:1.5;color:#8C8A90;margin-top:8px}

.cta{margin-top:clamp(38px,5.6vw,56px);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:15px;
  font-weight:600;padding:15px 34px;border-radius:999px;border:0;cursor:pointer;color:#141316;
  background:linear-gradient(178deg,#FDFDFE 0%,#F1F2F3 40%,#D5D8D9 100%);box-shadow:var(--lift-light);
  transition:transform .12s cubic-bezier(.3,.8,.4,1)}
.btn:active{transform:translateY(4px)}

footer{margin-top:auto;padding:clamp(30px,4vw,44px) 20px;text-align:center}
footer nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-family:var(--mono);
  font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
footer nav a{color:var(--dim)}
footer nav a:hover{color:var(--text)}
footer .fine{margin-top:20px;font-size:12px;color:#4E4C53}

.heart{width:clamp(150px,26vw,220px);margin:0 auto clamp(22px,3.4vw,32px);
  position:relative;animation:heartbreathe 11s ease-in-out infinite;will-change:transform}
@keyframes heartbreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}
.lock{width:clamp(147px,22.5vw,201px);margin:0 auto;display:flex;align-items:center;justify-content:center}.lock img{width:57%;height:auto;display:block}.lock .bar{flex:none;width:2px;height:clamp(17px,2.62vw,23px);background:#E9EAEB;opacity:.9;margin:0 5%}.lock .sd{font-family:var(--sans);font-weight:600;font-size:clamp(11px,1.71vw,15px);letter-spacing:.22em;color:#E9EAEB;line-height:1;white-space:nowrap}

.signupkey{display:inline-block;line-height:0;
  transition:transform .12s cubic-bezier(.3,.8,.4,1),filter .2s}
.signupkey img{width:clamp(168px,26vw,208px);height:auto;display:block}
.signupkey:hover{transform:translateY(-2px);filter:brightness(1.06)}
.signupkey:active{transform:translateY(2px) scale(.985)}

.vid{margin-top:clamp(32px,5vw,48px)}
.vslot{position:relative;width:min(330px,78vw);margin-inline:auto;aspect-ratio:9/19.5;
  border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,#0A090B 0%,#141216 100%);box-shadow:var(--sink);
  display:grid;place-items:center;text-align:center;padding:24px}
.vslot .vp{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5E5C63}
.vslot video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  border-radius:30px;background:#000}
.pucks{display:flex;gap:clamp(16px,3vw,26px);justify-content:center;align-items:center}.puck{line-height:0;transition:transform .12s cubic-bezier(.3,.8,.4,1),filter .2s}.puck img{width:clamp(46px,8vw,62px);height:auto;display:block;border-radius:50%}.puck:hover{transform:translateY(-2px);filter:brightness(1.08)}.puck:active{transform:translateY(2px) scale(.985)}.site{display:inline-block;margin-top:clamp(20px,3vw,28px);font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);transition:color .18s}.site:hover{color:var(--text)}.vslot{overflow:hidden;position:relative}.snd{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(20,20,22,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .16s,background .16s}.snd:hover{transform:scale(1.06);background:rgba(30,30,33,.7)}.snd[aria-pressed="true"] #sndx{display:none}.vfill{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
</style>
</head>
<body>
<div class="wrap">
  <img class="heart" src="/home/assets/photo-1.jpg" alt="" aria-hidden="true">
  <div class="lock"><img src="/home/assets/atto-lockup.png" alt="ATTO SOUND"><span class="bar"></span><span class="sd">SOUND</span></div>

  <section class="vid"><span class="label">See it</span><h1 style="margin-bottom:clamp(18px,2.6vw,24px)">A call, start to finish.</h1><div class="vslot"><video id="demo" class="vfill" src="/home/assets/call-demo-v3.mp4" poster="/home/assets/call-demo-poster.jpg" autoplay muted loop playsinline preload="metadata"></video><button id="snd" class="snd" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndx" d="M16.5 8.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div></section><span class="label">Hear it</span>
  <h1>A minute and a half of Larry, from inside.</h1>
  

  <div class="deck">
    <div class="meta">
      <div class="t" id="trackTitle">Let There Be Life</div>
      <div class="a" id="trackArtist">Suicide King</div>
    </div>

    <div class="player">
      <button class="play" id="play" aria-label="Play">
        <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div class="bars" id="bars" role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="wave" aria-hidden="true"></canvas>
      </div>
      <div class="time" id="time">0:00</div>
    </div>

    <audio id="audio" preload="metadata" src="/home/assets/let-there-be-life.mp3"></audio>
    <p class="note" id="note">Nothing here was mixed or mastered. That is the beat and his vocals, put together by the app. Published with consent.</p>
  </div>

  

  
</div>

<footer>
  <nav class="pucks"><a class="puck" href="https://instagram.com/attosound" target="_blank" rel="noopener" aria-label="Instagram"><img src="/home/assets/photo-2.jpg" alt="Instagram"></a><a class="puck" href="https://tiktok.com/@attosound" target="_blank" rel="noopener" aria-label="TikTok"><img src="/home/assets/photo-3.jpg" alt="TikTok"></a><a class="puck" href="https://youtube.com/@attosound" target="_blank" rel="noopener" aria-label="YouTube"><img src="/home/assets/photo-4.jpg" alt="YouTube"></a></nav><a class="site" href="https://attosound.com" target="_blank" rel="noopener">attosound.com</a>
  <div class="fine">&copy; 2026 ATTO Inc.</div>
</footer>

<script>
(function(){
  var audio = document.getElementById("audio"),
      play  = document.getElementById("play"),
      icon  = document.getElementById("icon"),
      bars  = document.getElementById("bars"),
      cv    = document.getElementById("wave"),
      tEl   = document.getElementById("time"),
      note  = document.getElementById("note");

  var PLAY = "M7 4.5v15l13-7.5z", PAUSE = "M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z";
  var ready = !!(audio.getAttribute("src") || "").trim();
  if (!ready){
    play.disabled = true; play.style.opacity = .45; play.style.cursor = "default";
    note.textContent = "No audio loaded yet — drop Larry's clip in.";
  }

  var N = 96, amps = (function(){
    var s = 20240911, out = [];
    function rnd(){ s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }
    for (var i = 0; i < N; i++){
      var p = i / (N - 1), env = Math.pow(Math.sin(Math.PI * p), 0.5);
      out.push(0.18 + env * (0.30 + 0.70 * rnd()));
    }
    return out;
  })();

  var dpr = 1, w = 0, h = 0;
  function size(){
    var r = bars.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height));
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    draw();
  }
  function draw(){
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var prog = (audio.duration && isFinite(audio.duration)) ? audio.currentTime / audio.duration : 0;
    var pad = 10, gap = (w - pad * 2) / N, bw = Math.max(2, gap * 0.58);
    for (var i = 0; i < N; i++){
      var x = pad + i * gap + (gap - bw) / 2;
      var a = Math.max(1, amps[i] * (h / 2 - 8));
      ctx.fillStyle = (i / N) <= prog ? "#E6E8E9" : "#3A373C";
      if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, h/2 - a, bw, a * 2, bw / 2); ctx.fill(); }
      else ctx.fillRect(x, h/2 - a, bw, a * 2);
    }
  }
  function fmt(s){
    if (!isFinite(s) || s < 0) return "0:00";
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function tick(){
    tEl.textContent = fmt(audio.duration ? audio.duration - audio.currentTime : 0);
    draw();
    if (!audio.paused && !audio.ended) requestAnimationFrame(tick);
  }
  audio.addEventListener("play", function(){
    icon.firstElementChild.setAttribute("d", PAUSE); play.setAttribute("aria-label", "Pause"); tick();
  });
  audio.addEventListener("pause", function(){
    icon.firstElementChild.setAttribute("d", PLAY); play.setAttribute("aria-label", "Play"); draw();
  });
  audio.addEventListener("loadedmetadata", function(){ tEl.textContent = fmt(audio.duration); draw(); });
  audio.addEventListener("ended", function(){ audio.currentTime = 0; draw(); });

  play.addEventListener("click", function(){
    if (!ready) return;
    if (audio.paused) audio.play(); else audio.pause();
  });
  function seek(x){
    if (!audio.duration) return;
    var r = bars.getBoundingClientRect();
    audio.currentTime = Math.min(Math.max((x - r.left) / r.width, 0), 1) * audio.duration;
    draw();
  }
  bars.addEventListener("click", function(e){ seek(e.clientX); });
  bars.addEventListener("keydown", function(e){
    if (!audio.duration) return;
    if (e.key === "ArrowRight"){ audio.currentTime = Math.min(audio.currentTime + 5, audio.duration); draw(); e.preventDefault(); }
    if (e.key === "ArrowLeft"){ audio.currentTime = Math.max(audio.currentTime - 5, 0); draw(); e.preventDefault(); }
  });

  size();
  var to; window.addEventListener("resize", function(){ clearTimeout(to); to = setTimeout(size, 120); });
})();
</script>
<script>
(function(){
  var v = document.getElementById("demo"), b = document.getElementById("snd");
  if (!v || !b) return;
  // Browsers only autoplay muted, so the visitor turns the sound on.
  b.addEventListener("click", function(){
    v.muted = !v.muted;
    b.setAttribute("aria-pressed", String(!v.muted));
    b.setAttribute("aria-label", v.muted ? "Sound on" : "Sound off");
    if (!v.muted) { v.volume = 1; v.play().catch(function(){}); }
  });
})();
</script>
</body>
</html>
